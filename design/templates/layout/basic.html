{% load django_bootstrap5 %}
{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Design.pro{% endblock %}</title>
    {% bootstrap_css %}
    <link rel="stylesheet" href="{% static 'design/style.css' %}">
    {% bootstrap_javascript %}
</head>
<body class="container mt-4">
<header>
    <h1 class="text-center mb-4">Дизайн-студия Design.pro</h1>
    <nav class="nav justify-content-end mb-4">
        <a class="nav-link" href="/">Главная</a>
    </nav>
</header>
<main>
    {% block content %}
    {% endblock %}
</main>
</body>
</html>
