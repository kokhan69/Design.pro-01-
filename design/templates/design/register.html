{% extends 'layout/basic.html' %}
{% load django_bootstrap5 %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<h2>Регистрация</h2>
<form method="post">
    {% csrf_token %}
    {% bootstrap_form form layout='horizontal' %}
    <button type="submit" class="btn btn-success mt-3">Зарегистрироваться</button>
</form>
{% endblock %}
