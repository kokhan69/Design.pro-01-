{% extends 'layout/basic.html' %}
{% block title %}Удаление заявки{% endblock %}
{% block content %}
<h2>Удаление заявки</h2>
<p>Вы уверены, что хотите удалить заявку <strong>"{{ object.title }}"</strong>?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Да, удалить</button>
    <a href="{% url 'profile' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
